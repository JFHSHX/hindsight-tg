# tg-memory-bridge 接线补丁（组合包声明在 package.json 的 dsh.bundle.patch）。
#
# ⚠️ 本文件随仓库分发，禁止写入任何敏感值（token/chatId/代理）。
#    敏感配置的三个去处（优先级从高到低）：
#    1. ~/.dsh/tg-memory/config.json（本地文件，永不入库）——推荐
#    2. 环境变量：TG_BOT_TOKEN / TG_PROXY
#    3. 你本机 profile 的 cordis.patch.yml 里按 id 覆盖（注意应用可能重写该文件）
#
#    config.json 示例：
#    {
#      "token": "123456789:AA...",
#      "proxy": "socks5://127.0.0.1:10808",
#      "chatId": "",
#      "llmBaseURL": "https://你的中转/v1",
#      "llmModel": "your-model",
#      "llmApiKeyEnv": "NS_API_KEY"
#    }
- insert:
    - id: tg-memory-bridge
      name: tg-memory-bridge
      config: {}
